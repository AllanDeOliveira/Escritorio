version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: central_jvo_postgres
    restart: always
    environment:
      POSTGRES_USER: lexgen
      POSTGRES_PASSWORD: lexgen_password
      POSTGRES_DB: lexgen_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: central_jvo_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  pgadmin:
    image: dpage/pgadmin4
    container_name: central_jvo_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres

volumes:
  postgres_data:
  redis_data:
